}

.vg a { color: inherit; text-decoration: none; }

/* The "stage" — dark cinematic frame that houses the widget canvas
   across all three directions so the dark engine reads as intentional */
.vg-stage {
  background: #06090f;
  color: #f0f4ff;
  border-radius: 14px;
  overflow: hidden;
  box-shadow:
    0 1px 0 rgba(255,255,255,0.06) inset,
    0 30px 80px -30px rgba(10,12,30,0.55),
    0 6px 18px -6px rgba(10,12,30,0.25);
}
.vg-stage--flat {
  border-radius: 0;
  box-shadow: none;
}

/* Tags inside the dark stage */
.vg-tag {
  display: inline-flex; align-items: center; gap: 8px;
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: 1.6px;
  text-transform: uppercase;
  padding: 5px 11px;
  border-radius: 100px;
  font-family: var(--vg-body);
}
.vg-tag::before {
  content: ''; width: 5px; height: 5px; border-radius: 50%;
  background: currentColor; box-shadow: 0 0 6px currentColor;
}
.vg-tag--red   { color: #f87171; background: rgba(248,113,113,0.10); border: 1px solid rgba(248,113,113,0.25); }
.vg-tag--green { color: #4ade80; background: rgba(74,222,128,0.10); border: 1px solid rgba(74,222,128,0.25); }
.vg-tag--ink   { color: var(--vg-ink); background: transparent; border: 1px solid var(--vg-line); }
.vg-tag--ink::before { box-shadow: none; }

/* canvas itself */
.vg-canvas {
  width: 100%;
  display: block;
  background: #06090f;
}

/* ============================================================
   DIRECTION A — Cinemática (Porsche-led editorial)
   ============================================================ */

.dir-a {
  --dirA-bg: var(--vg-bg);
  --dirA-ink: var(--vg-ink);
  --dirA-accent: var(--vg-accent);
  background: var(--dirA-bg);
  color: var(--dirA-ink);
}

/* ── Nav ── (Sci-fi dark blue — independent of page palette) */
.dirA-nav {
  position: sticky; top: 0; z-index: 5;
  background:
    linear-gradient(180deg, #02061a 0%, #050b26 100%);
  backdrop-filter: blur(14px);
  border-bottom: 1px solid rgba(125, 211, 252, 0.16);
  box-shadow:
    0 1px 0 rgba(125, 211, 252, 0.06) inset,
    0 8px 32px -8px rgba(56, 189, 248, 0.10);
  overflow: hidden;
}
.dirA-nav::before {
  /* Subtle scanline grid for sci-fi vibe */
  content: '';
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(90deg, rgba(125, 211, 252, 0.06) 1px, transparent 1px);
  background-size: 48px 100%;
  pointer-events: none;
  opacity: 0.7;
}
.dirA-nav::after {
  /* Glow bar centered on the bottom edge */
  content: '';
  position: absolute;
  left: 50%; bottom: -1px;
  width: 280px; height: 2px;
  transform: translateX(-50%);
  background: linear-gradient(90deg, transparent, #38bdf8, transparent);
  filter: blur(0.3px);
  opacity: 0.55;
}
.dirA-nav__inner {
  max-width: 1320px; margin: 0 auto;
  display: grid; grid-template-columns: auto 1fr auto; align-items: center;
  gap: 32px;
  padding: 14px 48px;
  position: relative;
}
.dirA-logo {
  display: inline-flex; align-items: center; gap: 12px;
  font-family: 'Geist', 'Inter', sans-serif;
  font-weight: 600;
  font-size: 16px;
  letter-spacing: 0.06em;
  color: #e0f2fe;
  text-transform: uppercase;
}
.dirA-logo__img {
  height: 38px;
  width: auto;
  display: block;
  filter:
    drop-shadow(0 0 10px rgba(56, 189, 248, 0.45))
    drop-shadow(0 0 24px rgba(56, 189, 248, 0.25));
}
.dirA-logo__word {
  text-shadow: 0 0 12px rgba(56, 189, 248, 0.35);
}
.dirA-logo--big {
  font-size: 32px;
  letter-spacing: -0.5px;
  color: #f0f9ff;
  text-transform: none;
  font-family: var(--vg-display);
}
.dirA-logo--big .dirA-logo__img {
  height: 62px;
  filter:
    drop-shadow(0 0 14px rgba(56, 189, 248, 0.42))
    drop-shadow(0 0 32px rgba(56, 189, 248, 0.22));
}
.dirA-logo--big .dirA-logo__word {
  text-shadow: 0 0 16px rgba(56, 189, 248, 0.30);
}

.dirA-nav__links {
  display: flex; gap: 28px; justify-self: center;
  font-size: 12px;
  font-family: 'Geist', 'Inter', sans-serif;
  letter-spacing: 0.18em;
  text-transform: uppercase;
}
.dirA-nav__links a {
  color: #93c5fd;
  transition: color .15s, text-shadow .15s;
  padding: 6px 2px;
  position: relative;
}
.dirA-nav__links a::after {
  content: '';
  position: absolute;
  left: 50%; bottom: -2px;
  width: 0; height: 1px;
  background: #38bdf8;
  box-shadow: 0 0 8px #38bdf8;
  transition: width .2s, left .2s;
}
.dirA-nav__links a:hover {
  color: #e0f2fe;
  text-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
}
.dirA-nav__links a:hover::after {
  width: 100%;
  left: 0;
}

.dirA-cta {
  font-family: 'Geist', 'Inter', sans-serif;
  font-size: 11.5px;
  font-weight: 600;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  background: transparent;
  color: #e0f2fe;
  padding: 10px 18px;
  border: 1px solid rgba(125, 211, 252, 0.38);
  border-radius: 2px;
  transition: background .15s, border-color .15s, box-shadow .15s, color .15s;
  position: relative;
}
.dirA-cta::before {
  /* Corner brackets — small sci-fi tick marks */
  content: '';
  position: absolute;
  top: -3px; left: -3px;
  width: 8px; height: 8px;
  border-top: 1px solid #38bdf8;
  border-left: 1px solid #38bdf8;
  opacity: 0.7;
}
.dirA-cta::after {
  content: '';
  position: absolute;
  bottom: -3px; right: -3px;
  width: 8px; height: 8px;
  border-bottom: 1px solid #38bdf8;
  border-right: 1px solid #38bdf8;
  opacity: 0.7;
}
.dirA-cta:hover {
  background: rgba(56, 189, 248, 0.10);
  border-color: #38bdf8;
  color: #f0f9ff;
  box-shadow:
    0 0 18px rgba(56, 189, 248, 0.35),
    inset 0 0 12px rgba(56, 189, 248, 0.08);
}

/* ── Hero ── (Sci-fi dark control-room — independent of palette) */
.dirA-hero {
  padding: 96px 0 80px;
  background: linear-gradient(180deg, #02061a 0%, #050b26 55%, #060d2e 100%);
  position: relative;
  overflow: hidden;
  color: #e0f2fe;
}
.dirA-hero::before {
  /* scanline grid */
  content: '';
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(90deg, rgba(125, 211, 252, 0.06) 1px, transparent 1px),
    linear-gradient(180deg, rgba(125, 211, 252, 0.05) 1px, transparent 1px);
  background-size: 56px 56px;
  pointer-events: none;
  mask-image: radial-gradient(ellipse 90% 70% at 50% 30%, #000 0%, transparent 80%);
  -webkit-mask-image: radial-gradient(ellipse 90% 70% at 50% 30%, #000 0%, transparent 80%);
  opacity: 0.85;
}
.dirA-hero::after {
  /* soft cyan glow at the top */
  content: '';
  position: absolute;
  top: -240px; left: 50%;
  width: 800px; height: 480px;
  transform: translateX(-50%);
  background: radial-gradient(ellipse, rgba(56, 189, 248, 0.20) 0%, transparent 65%);
  pointer-events: none;
}
.dirA-hero > * {
  position: relative;
  z-index: 1;
}

.dirA-hero__head {
  max-width: 1320px;
  margin: 0 auto 56px;
  padding: 0 48px;
  display: grid;
  grid-template-columns: 1.05fr 0.95fr;
  gap: 80px;
  align-items: end;
}
.dirA-hero__eyebrow {
  grid-column: 1 / -1;
  font-family: 'Geist', 'Inter', sans-serif;
  font-size: 11.5px;
  font-weight: 600;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: #7dd3fc;
  margin-bottom: 32px;
  display: inline-flex;
  align-items: center;
  text-shadow: 0 0 12px rgba(56, 189, 248, 0.35);
}

.dirA-headline {
  font-family: var(--vg-display);
  font-weight: 700;
  font-size: clamp(56px, 7.2vw, 104px);
  line-height: 0.86;
  letter-spacing: -0.065em;
  margin: 0;
  color: #f0f9ff;
  text-shadow: 0 0 32px rgba(56, 189, 248, 0.15);
}
.dirA-headline__line { display: block; }
.dirA-headline__line--em {
  font-style: italic;
  font-weight: 500;
  color: #bae6fd;
  text-shadow:
    0 0 14px rgba(56, 189, 248, 0.55),
    0 0 36px rgba(56, 189, 248, 0.30);
}
.dirA-headline__div {
  display: inline-block;
  color: #38bdf8;
  font-weight: 300;
  margin: 0 .05em;
  transform: translateY(-0.04em);
  font-style: normal;
  text-shadow: 0 0 18px rgba(56, 189, 248, 0.7);
}

.dirA-lede {
  font-size: 19px;
  line-height: 1.55;
  color: #c7d8f5;
  max-width: 460px;
  margin: 0;
  padding-bottom: 8px;
  font-family: var(--vg-body);
}
.dirA-lede em {
  font-style: italic;
  color: #e0f2fe;
  font-weight: 500;
  text-shadow: 0 0 10px rgba(56, 189, 248, 0.4);
}

/* Stage */
.dirA-stage {
  max-width: 1320px;
  margin: 0 auto 56px;
  padding: 0 48px;
}
.dirA-stage__chrome {
  position: relative;
  padding: 14px;
  /* HUD corner brackets via multi-gradient backgrounds */
  background:
    linear-gradient(#7dd3fc, #7dd3fc) top    left  / 18px 1px no-repeat,
    linear-gradient(#7dd3fc, #7dd3fc) top    left  / 1px 18px no-repeat,
    linear-gradient(#7dd3fc, #7dd3fc) top    right / 18px 1px no-repeat,
    linear-gradient(#7dd3fc, #7dd3fc) top    right / 1px 18px no-repeat,
    linear-gradient(#7dd3fc, #7dd3fc) bottom left  / 18px 1px no-repeat,
    linear-gradient(#7dd3fc, #7dd3fc) bottom left  / 1px 18px no-repeat,
    linear-gradient(#7dd3fc, #7dd3fc) bottom right / 18px 1px no-repeat,
    linear-gradient(#7dd3fc, #7dd3fc) bottom right / 1px 18px no-repeat;
}
.dirA-stage__meta {
  display: grid;
  grid-template-columns: auto 1fr auto;
  gap: 24px;
  align-items: center;
  padding: 6px 12px 14px;
  margin-bottom: 10px;
  border-bottom: 1px solid rgba(125, 211, 252, 0.16);
  font-family: 'Geist', 'Inter', sans-serif;
  font-size: 11px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: #c7d8f5;
}
.dirA-stage__rec {
  color: #f87171;
  font-weight: 700;
  text-shadow: 0 0 10px rgba(248, 113, 113, 0.5);
}
.dirA-stage__title { text-align: center; color: #c7d8f5; }

/* CD-XX odometer label inside the stage meta bar */
.dirA-cd {
  display: inline-block;
  min-width: 5.4ch;
  font-variant-numeric: tabular-nums;
  letter-spacing: 0.18em;
  color: #e0f2fe;
  text-shadow: 0 0 8px rgba(56, 189, 248, 0.30);
  transition: color .15s;
}
.dirA-cd--rolling {
  color: #7dd3fc;
  text-shadow:
    0 0 6px rgba(56, 189, 248, 0.55),
    0 0 16px rgba(56, 189, 248, 0.35);
  animation: dirA-cd-flicker 0.12s steps(2) infinite;
}
@keyframes dirA-cd-flicker {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.6; }
}
.dirA-stage__clock {
  text-align: right;
  font-variant-numeric: tabular-nums;
  color: #c7d8f5;
}

/* The widget container itself — sci-fi monitor */
.dirA-stage .vg-stage {
  background: #02061a;
  border: 1px solid rgba(125, 211, 252, 0.12);
  border-radius: 0;
  box-shadow:
    0 0 0 1px rgba(125, 211, 252, 0.04) inset,
    0 40px 80px -30px rgba(0, 0, 0, 0.7),
    0 0 60px -20px rgba(56, 189, 248, 0.18);
}
.dirA-stage .vg-stage-frame--lg { padding: 24px; }

.dirA-stage__caption {
  display: flex; align-items: baseline; gap: 16px;
  margin-top: 22px;
  padding: 0 4px;
  font-size: 14px;
  color: #93c5fd;
  font-family: var(--vg-body);
  font-style: italic;
}
.dirA-stage__num {
  font-family: 'Geist', 'Inter', sans-serif;
  font-style: normal;
  font-size: 11px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: #e0f2fe;
  text-shadow: 0 0 8px rgba(56, 189, 248, 0.35);
}

/* ── Metric strip ── (HUD readout) */
.dirA-hero__stripWrap {
  max-width: 1320px;
  margin: 36px auto 0;
  padding: 0 48px;
  position: relative;
}

/* Header bar above the strip */
.dirA-strip__head {
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  gap: 24px;
  padding: 0 4px 12px;
  font-family: 'Geist', 'Inter', sans-serif;
  font-size: 11px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: #7dd3fc;
}
.dirA-strip__head-tag {
  color: #38bdf8;
  text-shadow: 0 0 10px rgba(56, 189, 248, 0.45);
  font-weight: 700;
}
.dirA-strip__head-mid {
  color: #93b3d8;
  text-align: center;
  letter-spacing: 0.18em;
}
.dirA-strip__head-live {
  display: inline-flex; align-items: center; gap: 8px;
  color: #4ade80;
  font-weight: 700;
  text-shadow: 0 0 10px rgba(74, 222, 128, 0.45);
}
.dirA-strip__head-dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: #4ade80;
  box-shadow:
    0 0 0 3px rgba(74, 222, 128, 0.18),
    0 0 12px rgba(74, 222, 128, 0.80);
  animation: dirA-live-pulse 1.8s ease-in-out infinite;
}

.dirA-hero__strip {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 0;
  border-top: 1px solid rgba(125, 211, 252, 0.28);
  border-bottom: 1px solid rgba(125, 211, 252, 0.28);
  position: relative;
  background:
    linear-gradient(180deg, rgba(56, 189, 248, 0.04), rgba(56, 189, 248, 0) 60%);
  overflow: hidden;
}
.dirA-hero__strip::before,
.dirA-hero__strip::after {
  /* HUD corner brackets on the strip frame */
  content: '';
  position: absolute;
  width: 16px;
  height: 16px;
  pointer-events: none;
  z-index: 2;
}
.dirA-hero__strip::before {
  top: -1px; left: -1px;
  border-top: 1px solid #38bdf8;
  border-left: 1px solid #38bdf8;
  filter: drop-shadow(0 0 6px rgba(56, 189, 248, 0.65));
}
.dirA-hero__strip::after {
  bottom: -1px; right: -1px;
  border-bottom: 1px solid #38bdf8;
  border-right: 1px solid #38bdf8;
  filter: drop-shadow(0 0 6px rgba(56, 189, 248, 0.65));
}

/* Sweep removido */
.dirA-hero__strip > .dirA-strip__sweep { display: none; }

.dirA-strip__item {
  position: relative;
  padding: 30px 22px 26px;
  border-right: 1px solid rgba(125, 211, 252, 0.12);
  display: flex; flex-direction: column;
  align-items: center;
  text-align: center;
  gap: 16px;
  transition: background .25s;
}
.dirA-strip__item:last-child { border-right: 0; }
.dirA-strip__item:hover {
  background: rgba(56, 189, 248, 0.06);
}
.dirA-strip__item::before {
  /* faint left-edge bar that lights up on hover */
  content: '';
  position: absolute;
  left: 0; top: 18px; bottom: 18px;
  width: 2px;
  background: linear-gradient(180deg, transparent, rgba(125, 211, 252, 0.18), transparent);
  transition: background .25s, box-shadow .25s;
}
.dirA-strip__item:hover::before {
  background: linear-gradient(180deg, transparent, #38bdf8, transparent);
  box-shadow: 0 0 12px rgba(56, 189, 248, 0.55);
}

/* Trend mark (top of cell) */
.dirA-strip__trend {
  font-family: 'Geist', 'Inter', sans-serif;
  font-size: 16px;
  line-height: 1;
  width: 28px; height: 28px;
  display: inline-flex; align-items: center; justify-content: center;
  border: 1px solid rgba(125, 211, 252, 0.30);
  border-radius: 0;
  align-self: flex-start;
  background: rgba(2, 6, 26, 0.5);
  position: relative;
}
.dirA-strip__trend::before,
.dirA-strip__trend::after {
  /* tiny tick marks on the trend box */
  content: '';
  position: absolute;
  width: 4px; height: 4px;
  pointer-events: none;
}
.dirA-strip__trend::before {
  top: -1px; left: -1px;
  border-top: 1px solid #7dd3fc;
  border-left: 1px solid #7dd3fc;
}
.dirA-strip__trend::after {
  bottom: -1px; right: -1px;
  border-bottom: 1px solid #7dd3fc;
  border-right: 1px solid #7dd3fc;
}
.dirA-strip__item--up   .dirA-strip__trend { color: #4ade80; text-shadow: 0 0 10px rgba(74, 222, 128, 0.55); border-color: rgba(74, 222, 128, 0.30); }
.dirA-strip__item--down .dirA-strip__trend { color: #4ade80; text-shadow: 0 0 10px rgba(74, 222, 128, 0.55); border-color: rgba(74, 222, 128, 0.30); }
.dirA-strip__item--zero .dirA-strip__trend { color: #7dd3fc; text-shadow: 0 0 10px rgba(56, 189, 248, 0.55); }

/* The number itself */
.dirA-strip__num {
  display: inline-flex;
  align-items: baseline;
  line-height: 0.92;
  font-family: var(--vg-display);
  font-feature-settings: 'tnum';
  font-variant-numeric: tabular-nums;
  color: #f0f9ff;
  text-shadow:
    0 0 10px rgba(56, 189, 248, 0.20),
    0 0 24px rgba(56, 189, 248, 0.08);
}
.dirA-strip__sign {
  font-size: clamp(26px, 3vw, 42px);
  font-weight: 400;
  color: #38bdf8;
  text-shadow:
    0 0 8px rgba(56, 189, 248, 0.40),
    0 0 20px rgba(56, 189, 248, 0.18);
  margin-right: 4px;
  transform: translateY(-0.06em);
}
.dirA-strip__val {
  font-size: clamp(44px, 5vw, 68px);
  font-weight: 700;
  letter-spacing: -0.045em;
  color: #ffffff;
}
.dirA-strip__unit {
  font-size: clamp(15px, 1.6vw, 22px);
  font-weight: 500;
  letter-spacing: -0.02em;
  color: rgba(199, 216, 245, 0.65);
  margin-left: 4px;
  transform: translateY(-0.06em);
}

/* Zero-state stays bright but loses the cyan halo */
.dirA-strip__item--zero .dirA-strip__num {
  text-shadow: 0 0 16px rgba(56, 189, 248, 0.20);
}

/* Label below the number */
.dirA-strip__label {
  font-family: 'Geist', 'Inter', sans-serif;
  font-size: 11.5px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: #93b3d8;
  max-width: 22ch;
  line-height: 1.45;
  padding-top: 4px;
  border-top: 1px solid rgba(125, 211, 252, 0.10);
}
.dirA-strip__item:hover .dirA-strip__label {
  color: #c7d8f5;
}

/* ── Section heads ── (sci-fi) */
.dirA-section-head {
  max-width: 1320px;
  margin: 0 auto 56px;
  padding: 0 48px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 80px;
  align-items: end;
  position: relative;
  z-index: 1;
}
.dirA-eyebrow {
  font-family: 'Geist', 'Inter', sans-serif;
  font-size: 11.5px;
  font-weight: 600;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: #7dd3fc;
  text-shadow: 0 0 12px rgba(56, 189, 248, 0.30);
}
.dirA-h2 {
  font-family: var(--vg-display);
  font-weight: 700;
  font-size: clamp(40px, 4.5vw, 64px);
  line-height: 0.95;
  letter-spacing: -0.045em;
  margin: 0;
  color: #f0f9ff;
  text-shadow: 0 0 28px rgba(56, 189, 248, 0.18);
}

/* ── Features ── (sci-fi) */
.dirA-features {
  padding: 96px 0;
  background: linear-gradient(180deg, #060d2e 0%, #050b26 100%);
  border-top: 1px solid rgba(125, 211, 252, 0.18);
  color: #e0f2fe;
  position: relative;
  overflow: hidden;
}
.dirA-features::before {
  /* scanline grid */
  content: '';
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(90deg, rgba(125, 211, 252, 0.05) 1px, transparent 1px),
    linear-gradient(180deg, rgba(125, 211, 252, 0.04) 1px, transparent 1px);
  background-size: 56px 56px;
  mask-image: radial-gradient(ellipse 90% 65% at 50% 50%, #000 0%, transparent 80%);
  -webkit-mask-image: radial-gradient(ellipse 90% 65% at 50% 50%, #000 0%, transparent 80%);
  pointer-events: none;
  opacity: 0.75;
}
.dirA-features > * { position: relative; z-index: 1; }

.dirA-features__grid {
  max-width: 1320px;
  margin: 0 auto;
  padding: 0 48px;
  display: grid;
  grid-template-columns: 1.4fr 1fr;
  grid-template-rows: 1fr 1fr;
  gap: 16px;
  background: transparent;
  border: 0;
}
.dirA-feature {
  background: rgba(2, 6, 26, 0.55);
  padding: 32px 28px 28px;
  border: 1px solid rgba(125, 211, 252, 0.16);
  display: flex; flex-direction: column; gap: 14px;
  position: relative;
  min-height: 320px;
  transition: border-color .2s, background .2s;
}
.dirA-feature:hover {
  border-color: rgba(125, 211, 252, 0.34);
  background: rgba(2, 6, 26, 0.75);
}
/* HUD corner brackets — top-left + bottom-right */
.dirA-feature::before,
.dirA-feature::after {
  content: '';
  position: absolute;
  width: 12px; height: 12px;
  pointer-events: none;
}
.dirA-feature::before {
  top: -1px; left: -1px;
  border-top: 1px solid #7dd3fc;
  border-left: 1px solid #7dd3fc;
}
.dirA-feature::after {
  bottom: -1px; right: -1px;
  border-bottom: 1px solid #7dd3fc;
  border-right: 1px solid #7dd3fc;
}
.dirA-feature--lg {
  grid-row: span 2;
  padding: 44px 36px 36px;
  min-height: 0;
}
/* Visual compartilhado entre cards "online" (Picking + JIT) */
.dirA-feature--online {
  background: rgba(56, 189, 248, 0.05);
  border-color: rgba(125, 211, 252, 0.26);
}
.dirA-feature--online:hover {
  background: rgba(56, 189, 248, 0.09);
  border-color: rgba(125, 211, 252, 0.42);
}
.dirA-feature--online h3 {
  text-shadow: 0 0 22px rgba(56, 189, 248, 0.22);
}
.dirA-feature__num {
  font-family: 'Geist', 'Inter', sans-serif;
  font-size: 11px;
  letter-spacing: 0.18em;
  color: #7dd3fc;
}
.dirA-feature h3 {
  font-family: var(--vg-display);
  font-size: 26px;
  font-weight: 600;
  letter-spacing: -0.025em;
  margin: 0;
  color: #f0f9ff;
}
.dirA-feature--lg h3 {
  font-size: 36px;
  text-shadow: 0 0 22px rgba(56, 189, 248, 0.22);
}
.dirA-feature p {
  font-size: 15px;
  color: #c7d8f5;
  line-height: 1.6;
  margin: 0;
  max-width: 38ch;
}
.dirA-feature__list {
  list-style: none; padding: 0; margin: 6px 0 0;
  display: flex; flex-direction: column; gap: 8px;
}
.dirA-feature__list li {
  font-family: 'Geist', 'Inter', sans-serif;
  font-size: 11.5px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: #c7d8f5;
  padding-left: 18px;
  position: relative;
}
.dirA-feature__list li::before {
  content: '';
  position: absolute; left: 0; top: 0.55em;
  width: 10px; height: 1px;
  background: #7dd3fc;
  box-shadow: 0 0 6px rgba(56, 189, 248, 0.55);
}
.dirA-feature__chip {
  margin-top: auto;
  align-self: flex-start;
  font-family: 'Geist', 'Inter', sans-serif;
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  padding: 5px 11px 5px 9px;
  border-radius: 0;
  background: rgba(56, 189, 248, 0.10);
  color: #7dd3fc;
  border: 1px solid rgba(125, 211, 252, 0.38);
  display: inline-flex;
  align-items: center;
  gap: 8px;
}
.dirA-feature__chip__dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #4ade80;
  box-shadow:
    0 0 0 3px rgba(74, 222, 128, 0.20),
    0 0 12px rgba(74, 222, 128, 0.75);
  flex-shrink: 0;
  animation: dirA-live-pulse 1.8s ease-in-out infinite;
}
@keyframes dirA-live-pulse {
  0%, 100% {
    box-shadow:
      0 0 0 3px rgba(74, 222, 128, 0.18),
      0 0 10px rgba(74, 222, 128, 0.65);
  }
  50% {
    box-shadow:
      0 0 0 4px rgba(74, 222, 128, 0.32),
      0 0 18px rgba(74, 222, 128, 0.95);
  }
}
.dirA-feature__chip--soon {
  background: transparent;
  color: #7a93b9;
  border-color: rgba(125, 211, 252, 0.18);
}
.dirA-feature__chip__spinner {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  border: 1px solid rgba(125, 211, 252, 0.22);
  border-top-color: #7dd3fc;
  flex-shrink: 0;
  animation: dirA-loading-spin 0.9s linear infinite;
  box-shadow: 0 0 6px rgba(56, 189, 248, 0.35);
}
@keyframes dirA-loading-spin {
  to { transform: rotate(360deg); }
}

/* ── How ── (sci-fi) */
.dirA-how {
  padding: 96px 0;
  background: linear-gradient(180deg, #050b26 0%, #060d2e 100%);
  border-top: 1px solid rgba(125, 211, 252, 0.10);
  color: #e0f2fe;
  position: relative;
  overflow: hidden;
}
.dirA-how::before {
  content: '';
  position: absolute;
  inset: 0;
  background-image: linear-gradient(90deg, rgba(125, 211, 252, 0.045) 1px, transparent 1px);
  background-size: 56px 100%;
  pointer-events: none;
  opacity: 0.6;
}
.dirA-how > * { position: relative; z-index: 1; }

.dirA-how__rows {
  max-width: 1320px;
  margin: 0 auto;
  padding: 0 48px;
  display: flex; flex-direction: column;
}
.dirA-how__row {
  display: grid;
  grid-template-columns: 80px 360px 1fr;
  gap: 48px;
  padding: 36px 0 28px;
  border-top: 1px solid rgba(125, 211, 252, 0.12);
  align-items: start;
  position: relative;
}
.dirA-how__row:first-child {
  border-top: 1px solid rgba(125, 211, 252, 0.22);
}
.dirA-how__step {
  font-family: 'Geist', 'Inter', sans-serif;
  font-size: 13px;
  color: #7dd3fc;
  letter-spacing: 0.18em;
  text-shadow: 0 0 10px rgba(56, 189, 248, 0.40);
}
.dirA-how__title {
  font-family: var(--vg-display);
  font-size: 28px;
  font-weight: 600;
  letter-spacing: -0.025em;
  color: #f0f9ff;
}
.dirA-how__desc {
  font-size: 16px;
  color: #c7d8f5;
  max-width: 54ch;
  line-height: 1.65;
}

/* ── CTA band ── (sci-fi) */
.dirA-cta-band {
  background: linear-gradient(180deg, #060d2e 0%, #02061a 55%, #050b26 100%);
  color: #e0f2fe;
  position: relative;
  overflow: hidden;
}
.dirA-cta-band::before {
  /* scanline grid */
  content: '';
  position: absolute; inset: 0;
  background-image:
    linear-gradient(90deg, rgba(125, 211, 252, 0.05) 1px, transparent 1px),
    linear-gradient(180deg, rgba(125, 211, 252, 0.04) 1px, transparent 1px);
  background-size: 56px 56px;
  mask-image: radial-gradient(ellipse 80% 80% at 50% 50%, #000 0%, transparent 78%);
  -webkit-mask-image: radial-gradient(ellipse 80% 80% at 50% 50%, #000 0%, transparent 78%);
  opacity: 0.65;
  pointer-events: none;
}
.dirA-cta-band::after {
  /* central cyan glow */
  content: '';
  position: absolute;
  top: 35%; left: 50%;
  width: 900px; height: 600px;
  transform: translate(-50%, -50%);
  background: radial-gradient(ellipse, rgba(56, 189, 248, 0.18), transparent 65%);
  pointer-events: none;
}
.dirA-cta-band__inner {
  position: relative;
  z-index: 1;
  max-width: 1100px;
  margin: 0 auto;
  padding: 120px 48px;
  display: grid;
  grid-template-columns: 1fr;
  gap: 28px;
}
.dirA-cta-band__eyebrow {
  font-family: 'Geist', 'Inter', sans-serif;
  font-size: 11.5px;
  font-weight: 600;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: #7dd3fc;
  text-shadow: 0 0 12px rgba(56, 189, 248, 0.35);
}
.dirA-cta-band__h {
  font-family: var(--vg-display);
  font-weight: 700;
  font-size: clamp(40px, 5.5vw, 76px);
  line-height: 0.92;
  letter-spacing: -0.045em;
  margin: 0;
  color: #f0f9ff;
  text-shadow: 0 0 36px rgba(56, 189, 248, 0.22);
}
.dirA-cta-band__lede {
  font-size: 18px;
  color: #c7d8f5;
  max-width: 560px;
  line-height: 1.6;
  margin: 0;
}
.dirA-cta-band__row {
  display: flex; gap: 16px; margin-top: 14px;
  flex-wrap: wrap;
}

/* CTA buttons inside the band */
.dirA-cta-band .dirA-cta {
  font-family: 'Geist', 'Inter', sans-serif;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  padding: 16px 24px;
  border-radius: 2px;
  border: 1px solid rgba(125, 211, 252, 0.42);
  position: relative;
  transition: background .15s, border-color .15s, box-shadow .15s, color .15s;
}
.dirA-cta-band .dirA-cta::before,
.dirA-cta-band .dirA-cta::after {
  content: '';
  position: absolute;
  width: 8px; height: 8px;
  opacity: 0.75;
}
.dirA-cta-band .dirA-cta::before {
  top: -3px; left: -3px;
  border-top: 1px solid #38bdf8;
  border-left: 1px solid #38bdf8;
}
.dirA-cta-band .dirA-cta::after {
  bottom: -3px; right: -3px;
  border-bottom: 1px solid #38bdf8;
  border-right: 1px solid #38bdf8;
}
.dirA-cta-band .dirA-cta--solid {
  background: #38bdf8;
  color: #02061a;
  border-color: #38bdf8;
  box-shadow: 0 0 24px rgba(56, 189, 248, 0.40);
}
.dirA-cta-band .dirA-cta--solid:hover {
  background: #7dd3fc;
  border-color: #7dd3fc;
  color: #02061a;
  box-shadow: 0 0 40px rgba(56, 189, 248, 0.55);
}
.dirA-cta-band .dirA-cta--ghost {
  background: transparent;
  color: #e0f2fe;
}
.dirA-cta-band .dirA-cta--ghost:hover {
  background: rgba(56, 189, 248, 0.10);
  border-color: #38bdf8;
  color: #f0f9ff;
  box-shadow:
    0 0 18px rgba(56, 189, 248, 0.35),
    inset 0 0 12px rgba(56, 189, 248, 0.08);
}

/* ── Footer ── (sci-fi) */
.dirA-footer {
  background: #02061a;
  border-top: 1px solid rgba(125, 211, 252, 0.20);
  color: #c7d8f5;
  position: relative;
  overflow: hidden;
}
.dirA-footer::before {
  /* glow line at top edge */
  content: '';
  position: absolute;
  top: -1px; left: 50%;
  width: 320px; height: 2px;
  transform: translateX(-50%);
  background: linear-gradient(90deg, transparent, #38bdf8, transparent);
  opacity: 0.55;
  filter: blur(0.3px);
  pointer-events: none;
}
.dirA-footer__inner {
  max-width: 1320px;
  margin: 0 auto;
  padding: 72px 48px 56px;
  display: grid;
  grid-template-columns: minmax(220px, 0.9fr) 1.4fr;
  gap: 72px;
  align-items: start;
  position: relative;
  z-index: 1;
}
.dirA-footer__brand p {
  font-family: var(--vg-body);
  font-size: 15px;
  color: rgba(199, 216, 245, 0.72);
  max-width: 26ch;
  margin: 18px 0 0;
  line-height: 1.65;
}
.dirA-footer__cols {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 40px 48px;
  padding-top: 4px;
}
.dirA-footer__col {
  display: flex;
  flex-direction: column;
  gap: 10px;
  font-size: 14px;
  line-height: 1.55;
  color: #c7d8f5;
  font-family: var(--vg-body);
}
.dirA-footer__h {
  font-family: 'Geist', 'Inter', sans-serif;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: rgba(125, 211, 252, 0.52);
  margin: 0 0 4px;
  padding-bottom: 12px;
  border-bottom: 1px solid rgba(125, 211, 252, 0.12);
}
.dirA-footer__link {
  display: block;
  color: #e8f4ff;
  transition: color .15s;
  white-space: nowrap;
}
.dirA-footer__link:hover {
  color: #7dd3fc;
}
.dirA-footer__text {
  display: block;
  color: #c7d8f5;
}
.dirA-footer__text--muted {
  color: rgba(199, 216, 245, 0.58);
  font-size: 13px;
}
@media (max-width: 1024px) {
  .dirA-footer__inner {
    grid-template-columns: 1fr;
    gap: 48px;
    padding: 56px 32px 44px;
  }
  .dirA-footer__cols {
    grid-template-columns: repeat(2, 1fr);
    gap: 36px 32px;
  }
}
@media (max-width: 600px) {
  .dirA-footer__cols {
    grid-template-columns: 1fr;
    gap: 32px;
  }
  .dirA-footer__link {
    white-space: normal;
  }
}
.dirA-footer__base {
  max-width: 1320px;
  margin: 0 auto;
  padding: 24px 48px 36px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px 32px;
  align-items: center;
  font-family: 'Geist', 'Inter', sans-serif;
  font-size: 11px;
  color: #7a93b9;
  border-top: 1px solid rgba(125, 211, 252, 0.10);
  letter-spacing: 0.12em;
  text-transform: none;
  position: relative;
  z-index: 1;
}
.dirA-footer__base > span:first-child {
  text-transform: uppercase;
  letter-spacing: 0.18em;
}
.dirA-footer__base > span:nth-child(2) {
  text-align: right;
  text-transform: uppercase;
  letter-spacing: 0.12em;
}
.dirA-footer__copyright {
  grid-column: 2 / 3;
  text-align: right;
  font-size: 11px;
  letter-spacing: 0.08em;
  color: #7a93b9;
  padding-top: 8px;
  border-top: 1px solid rgba(125, 211, 252, 0.08);
  margin-top: 2px;
}
.dirA-footer__status {
  display: inline-flex !important;
  align-items: center;
  gap: 8px;
  color: #c7d8f5;
  text-align: center;
  justify-self: center;
}
.dirA-footer__statusDot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: #4ade80;
  box-shadow:
    0 0 0 3px rgba(74, 222, 128, 0.18),
    0 0 10px rgba(74, 222, 128, 0.60);
  animation: dirA-pulse 2.4s ease-in-out infinite;
}
@keyframes dirA-pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.5; }
}

/* ============================================================
   DIRECTION A — Tweakable variants
   Atmosfera × Paleta × Voz tipográfica
   ============================================================ */

/* ── PALETTES ─────────────────────────────────────────────── */

.pal-creme {
  --dirA-bg: #f4f0e8;
  --dirA-bg-2: #ebe6db;
  --dirA-ink: #0a0a0c;
  --dirA-ink-2: #1c1c1f;
  --dirA-muted: #6a665f;
  --dirA-muted-2: #8d8a83;
  --dirA-line: rgba(10,10,12,0.10);
  --dirA-line-2: rgba(10,10,12,0.06);
  --dirA-paper-cta: #0a0a0c;
  --dirA-paper-cta-ink: #f6f3ec;
}
.pal-linho {
  --dirA-bg: #f6f5f0;
  --dirA-bg-2: #ecebe4;
  --dirA-ink: #181d26;
  --dirA-ink-2: #2a3140;
  --dirA-muted: #6c7382;
  --dirA-muted-2: #98a0b0;
  --dirA-line: rgba(24,29,38,0.10);
  --dirA-line-2: rgba(24,29,38,0.06);
  --dirA-paper-cta: #181d26;
  --dirA-paper-cta-ink: #f6f5f0;
}
.pal-grafite {
  --dirA-bg: #14161b;
  --dirA-bg-2: #1c1f26;
  --dirA-ink: #f0ede5;
  --dirA-ink-2: #d8d3c7;
  --dirA-muted: #8b8a82;
  --dirA-muted-2: #6b6a64;
  --dirA-line: rgba(240,237,229,0.10);
  --dirA-line-2: rgba(240,237,229,0.05);
  --dirA-paper-cta: #f0ede5;
  --dirA-paper-cta-ink: #14161b;
}
.pal-cobalto {
  --dirA-bg: #08088f;
  --dirA-bg-2: #0a0a72;
  --dirA-ink: #f4f1e6;
  --dirA-ink-2: #e6e0ce;
  --dirA-muted: #a8a8d8;
  --dirA-muted-2: #7a7ab8;
  --dirA-line: rgba(244,241,230,0.16);
  --dirA-line-2: rgba(244,241,230,0.08);
  --dirA-paper-cta: #f4f1e6;
  --dirA-paper-cta-ink: #08088f;
}

/* Apply tokens to the design (override the originals from dir-a.css) */
.pal-creme .dir-a,
.pal-linho .dir-a,
.pal-grafite .dir-a,
.pal-cobalto .dir-a {
  background: var(--dirA-bg);
  color: var(--dirA-ink);
}
/* Navbar + Hero intentionally stay sci-fi across palettes — don't recolor here. */

.pal-creme .dirA-logo,
.pal-linho .dirA-logo,
.pal-grafite .dirA-logo,
.pal-cobalto .dirA-logo { /* navbar logo styled in dir-a.css */ }

.pal-creme .dirA-logo--big,
.pal-linho .dirA-logo--big,
.pal-grafite .dirA-logo--big,
.pal-cobalto .dirA-logo--big { color: var(--dirA-ink); }

/* Hero headline / lede / stage / strip / eyebrow — sci-fi (dir-a.css) */

/* Features + How sections — sci-fi (dir-a.css), decoupled from palette. */
/* Hero, navbar, features, how all stay sci-fi across palettes. */

/* CTA band + Footer — sci-fi (dir-a.css), decoupled from palette. */

.pal-cobalto .dirA-cta-band::before {
  background:
    radial-gradient(ellipse 60% 80% at 80% 30%, rgba(8,8,143,0.35), transparent 70%),
    radial-gradient(ellipse 40% 60% at 15% 100%, rgba(255,209,102,0.18), transparent 70%);
}
.pal-cobalto .dirA-cta-band__eyebrow { color: #ffd166; }
.pal-cobalto .dirA-cta--solid:hover { background: #ffd166; color: #08088f; }
.pal-cobalto .dirA-nav { backdrop-filter: blur(14px); }

/* — CINEMA — letterboxing, prominent timecode, FIG inflated. */
.mood-cinema .dirA-hero { padding-top: 64px; }
.mood-cinema .dirA-headline {
  font-size: clamp(64px, 9vw, 132px);
  letter-spacing: -0.05em;
}
.mood-cinema .dirA-stage {
  position: relative;
  padding: 28px 0;
  margin-bottom: 64px;
  background:
    linear-gradient(180deg, #06090f 0 28px, transparent 28px calc(100% - 28px), #06090f calc(100% - 28px) 100%);
}
.mood-cinema .dirA-stage__meta {
  position: relative;
  background: #06090f;
  margin: 0;
  padding: 12px 28px 14px;
  color: rgba(255,255,255,0.55);
  font-size: 11.5px;
  letter-spacing: 0.18em;
}
.mood-cinema .dirA-stage__meta::before,
.mood-cinema .dirA-stage__meta::after {
  content: '';
  position: absolute;
  left: 28px; right: 28px;
  height: 1px;
  background: rgba(255,255,255,0.10);
}
.mood-cinema .dirA-stage__meta::before { top: 0; }
.mood-cinema .dirA-stage__meta::after { bottom: 0; }
.mood-cinema .dirA-stage__rec {
  color: #ff5340;
  letter-spacing: 0.22em;
  font-weight: 700;
}
.mood-cinema .dirA-stage__title { color: rgba(255,255,255,0.78); }
.mood-cinema .dirA-stage__clock { color: rgba(255,255,255,0.78); }
.mood-cinema .dirA-stage__chrome .vg-stage {
  border-radius: 0;
  margin: 0;
  background: #06090f;
}
.mood-cinema .vg-stage-frame--lg { padding: 28px 36px 32px; }
.mood-cinema .dirA-stage__caption {
  background: #06090f;
  color: rgba(255,255,255,0.55);
  margin: 0;
  padding: 16px 28px 18px;
  font-size: 13px;
  border-top: 1px solid rgba(255,255,255,0.08);
}
.mood-cinema .dirA-stage__num { color: #fff; }
/* Heavy section heads */
.mood-cinema .dirA-h2 { font-size: clamp(48px, 5.8vw, 84px); letter-spacing: -0.04em; }
/* Subtle grain on hero background */
.mood-cinema .dirA-hero {
  background-image:
    radial-gradient(circle at 1px 1px, color-mix(in srgb, var(--dirA-ink) 6%, transparent) 1px, transparent 0);
  background-size: 3px 3px;
}

/* — SHOWROOM — restrained, removes editorial chrome, more air. */
.mood-showroom .dirA-stage__meta { display: none; }
.mood-showroom .dirA-stage__caption {
  border-top: 1px solid var(--dirA-line);
  padding-top: 20px;
  font-style: normal;
  font-size: 12.5px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}
.mood-showroom .dirA-stage__num {
  font-size: 10.5px;
}
.mood-showroom .vg-stage { border-radius: 4px; }
.mood-showroom .vg-stage-frame--lg { padding: 22px 22px 18px; }
.mood-showroom .dirA-hero { padding: 128px 48px 96px; }
.mood-showroom .dirA-hero__head { margin-bottom: 80px; gap: 96px; }
.mood-showroom .dirA-headline {
  font-size: clamp(48px, 6vw, 88px);
  font-weight: 300;
  letter-spacing: -0.035em;
  line-height: 1.0;
}
.mood-showroom .dirA-headline__line--em {
  font-weight: 200;
}
.mood-showroom .dirA-lede { font-size: 17px; max-width: 420px; }
.mood-showroom .dirA-hero__strip {
  border: 0;
  padding-top: 64px;
}
.mood-showroom .dirA-strip__item {
  padding: 12px 8px;
  border-right: 0;
}
.mood-showroom .dirA-strip__item b,
.mood-showroom .dirA-strip__val {
  font-weight: 300;
  font-size: 42px;
}
.mood-showroom .dirA-features,
.mood-showroom .dirA-how { padding: 128px 48px; }
.mood-showroom .dirA-feature {
  background: transparent !important;
  padding: 32px 0 40px;

  <!-- Widget engine (canvas animation — plain JS, no React dependency) -->
  <script>
'use strict';

// =============================================
// SIMULAÇÃO — Tradicional vs Maestro Vieglin
// 3 zonas · 12 prateleiras/zona · 20 operadores
// =============================================

const CW = 720, CH = 380;

const GROUPS = [
    { lx: 68,  rx: 128, zone: 0 },
    { lx: 308, rx: 368, zone: 1 },
    { lx: 548, rx: 608, zone: 2 },
];
const SW = 42, SH = 20;
const ROWS_Y   = [12, 98, 184, 270];
const AISLE_L  = 240;
const AISLE_R  = 480;
const BOTTOM_Y = 308;
const DEPOT    = { x: 360, y: 352 };

const WORKER_R  = 5;
const TRAIL_MAX = 28;
const SPEED     = 1.65;

function makeShelves() {
    const list = [];
    GROUPS.forEach((g, gi) => {
        ROWS_Y.forEach((ry, ri) => {
            list.push({ x: g.lx, y: ry, w: SW, h: SH, zone: g.zone, row: ri, group: gi });
            list.push({ x: g.rx, y: ry, w: SW, h: SH, zone: g.zone, row: ri, group: gi });
        });
    });
    return list;
}

function mid(s)        { return { x: s.x + s.w / 2, y: s.y + s.h / 2 }; }
function randFrom(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

function aisleFor(shelf) {
    if (shelf.zone === 0) return AISLE_L;
    if (shelf.zone === 2) return AISLE_R;
    const cx = shelf.x + SW / 2;
    return Math.abs(cx - AISLE_L) <= Math.abs(cx - AISLE_R) ? AISLE_L : AISLE_R;
}

function nearestShelf(pos, pool) {
    let best = null, bestD = Infinity;
    pool.forEach(s => {
        const d = Math.hypot(mid(s).x - pos.x, mid(s).y - pos.y);
        if (d < bestD) { bestD = d; best = s; }
    });
    return best || randFrom(pool);
}

const DEPOT_QUEUE = Array.from({ length: 20 }, (_, i) => ({
    x: DEPOT.x - 95 + (i % 10) * 21,
    y: DEPOT.y - Math.floor(i / 10) * 18,
}));

// --- Caminhos ---
function pathTo(from, shelf) {
    const ax = aisleFor(shelf), sc = mid(shelf);
    return [
        { x: from.x, y: BOTTOM_Y },
        { x: ax,     y: BOTTOM_Y },
        { x: ax,     y: sc.y     },
        { x: sc.x,   y: sc.y     },
    ];
}

function pathToDepot(from, aisle) {
    return [
        { x: aisle,   y: from.y   },
        { x: aisle,   y: BOTTOM_Y },
        { x: DEPOT.x, y: BOTTOM_Y },
        { x: DEPOT.x, y: DEPOT.y  },
    ];
}

function pathTo_wrongAisle(from, shelf) {
    const correct = aisleFor(shelf);
    const wrong   = correct === AISLE_L ? AISLE_R : AISLE_L;
    const sc = mid(shelf);
    return [
        { x: from.x,  y: BOTTOM_Y  },
        { x: wrong,   y: BOTTOM_Y  },
        { x: wrong,   y: sc.y + 20 },
        { x: correct, y: sc.y + 20 },
        { x: correct, y: sc.y      },
        { x: sc.x,    y: sc.y      },
    ];
}

function pathTo_overshoot(from, shelf) {
    const ax = aisleFor(shelf), sc = mid(shelf);
    const over = Math.max(8, sc.y - 36);
    return [
        { x: from.x, y: BOTTOM_Y },
        { x: ax,     y: BOTTOM_Y },
        { x: ax,     y: over     },
        { x: ax,     y: sc.y     },
        { x: sc.x,   y: sc.y     },
    ];
}

function chaosPath(from, shelf) {
    const r = Math.random();
    if (r < 0.30) return pathTo_wrongAisle(from, shelf);
    if (r < 0.50) return pathTo_overshoot(from, shelf);
    return pathTo(from, shelf);
}

// Desgaste de equipamento: rota de retorno larga e desnecessária
function chaosPathReturn(from, aisle) {
    const wrongAisle = aisle === AISLE_L ? AISLE_R : AISLE_L;
    return [
        { x: wrongAisle, y: from.y   },
        { x: wrongAisle, y: BOTTOM_Y },
        { x: DEPOT.x,    y: BOTTOM_Y },
        { x: DEPOT.x,    y: DEPOT.y  },
    ];
}

function stepTo(agent, target) {
    const dx = target.x - agent.pos.x, dy = target.y - agent.pos.y;
    const d  = Math.hypot(dx, dy);
    if (d < agent.spd + 0.5) {
        agent.pos.x = target.x;
        agent.pos.y = target.y;
        return true;
    }
    agent.pos.x += (dx / d) * agent.spd;
    agent.pos.y += (dy / d) * agent.spd;
    if (agent.trail) {
        agent.trail.push({ x: agent.pos.x, y: agent.pos.y });
        if (agent.trail.length > TRAIL_MAX) agent.trail.shift();
    }
    return false;
}

// ============================================================
// MODELO TRADICIONAL
// 2 coordenadores · 20 operadores "malicioso-conformes"
//
// Personalidade: sabe o suficiente para burlar sem ser demitido.
// Faz o mínimo para bater a meta, gerando retrabalho, devoluções
// e desgaste de equipamento.
// ============================================================

const TRAD_COLORS = [
    '#f87171','#fb923c','#fbbf24','#a3e635','#34d399',
    '#22d3ee','#60a5fa','#a78bfa','#f472b6','#e879f9',
    '#ef4444','#f97316','#eab308','#84cc16','#10b981',
    '#06b6d4','#3b82f6','#8b5cf6','#ec4899','#d946ef',
];

function makeCoordinators() {
    return [
        { id: 0, pos: { x: DEPOT.x + 62, y: DEPOT.y + 4 }, state: 'idle', targetWorker: null, timer: 0, spd: 2.8, _dest: null, _nextState: null },
        { id: 1, pos: { x: DEPOT.x - 62, y: DEPOT.y + 4 }, state: 'idle', targetWorker: null, timer: 0, spd: 2.8, _dest: null, _nextState: null },
    ];
}

function initWorkers_trad() {
    return TRAD_COLORS.map((color, i) => ({
        pos:       { ...DEPOT_QUEUE[i] },
        idx:       i,
        color,     spd: SPEED,
        path:      [], shelf: null,
        state:     'queued',
        timer:     0,  trail: [],
        hesitate:  0,
        aisle:     AISLE_L,
        rework:    false,
        coordId:   null,
    }));
}

function tickCoordinator(coord, workers, shelves) {
    if (coord.state === 'idle') {
        // Prioridade 1: receber entrega dos operadores que retornaram
        const handoff = workers.find(w => w.state === 'waiting_handoff' && w.coordId === null);
        if (handoff) {
            handoff.coordId    = coord.id;
            coord.targetWorker = handoff;
            coord.state        = 'moving';
            coord._dest        = { x: handoff.pos.x + 10, y: handoff.pos.y };
            coord._nextState   = 'receiving';
            return;
        }
        // Prioridade 2: dar briefing para operadores na fila
        const queued = workers.find(w => w.state === 'queued' && w.coordId === null);
        if (queued) {
            queued.coordId     = coord.id;
            queued.state       = 'being_briefed';
            coord.targetWorker = queued;
            coord.state        = 'moving';
            coord._dest        = { x: queued.pos.x + 14, y: queued.pos.y };
            coord._nextState   = 'briefing';
        }
    } else if (coord.state === 'moving') {
        if (stepTo(coord, coord._dest)) {
            coord.state = coord._nextState;
            coord.timer = coord._nextState === 'briefing' ? 55 : 18;
        }
    } else if (coord.state === 'briefing') {
        if (--coord.timer <= 0) {
            const w = coord.targetWorker;
            if (w) {
                // 30% de chance de mandar operador para uma prateleira já ocupada
                // (coordenadores sem visibilidade do trabalho um do outro)
                const activeShelves = workers
                    .filter(x => x.shelf && (x.state === 'toShelf' || x.state === 'picking'))
                    .map(x => x.shelf);
                const shelf = (activeShelves.length >= 2 && Math.random() < 0.30)
                    ? randFrom(activeShelves)
                    : randFrom(shelves);
                w.shelf      = shelf;
                w.aisle      = aisleFor(shelf);
                w.path       = chaosPath(w.pos, shelf);
                w.rework     = false;
                w.state      = 'toShelf';
                w.coordId    = null;
            }
            coord.targetWorker = null;
            coord.state = 'idle';
        }
    } else if (coord.state === 'receiving') {
        if (--coord.timer <= 0) {
            const w = coord.targetWorker;
            if (w) {
                w.state   = 'queued';
                w.coordId = null;
                w.trail   = [];
                w.pos.x   = DEPOT_QUEUE[w.idx].x;
                w.pos.y   = DEPOT_QUEUE[w.idx].y;
            }
            coord.targetWorker = null;
            coord.state = 'idle';
        }
    }
}

function tickWorker_trad(w, shelves, workers) {
    // Estados passivos: bloqueados aguardando coordenador
    if (w.state === 'queued' || w.state === 'being_briefed' || w.state === 'waiting_handoff') return;
    if (w.hesitate > 0) { w.hesitate--; return; }

    if (w.state === 'waiting_shelf') {
        // Fila na prateleira — aguarda o operador anterior terminar o picking
        const busy = workers.some(o => o !== w && o.shelf === w.shelf && o.state === 'picking');
        if (!busy) {
            if (w.path.length && stepTo(w, w.path[0])) w.path.shift();
            if (!w.path.length) {
                w.state = 'picking';
                w.timer = 90 + Math.floor(Math.random() * 70);
            }
        }

    } else if (w.state === 'toShelf') {
        // Pausas espontâneas no corredor — celular, conversa, "conferindo o papel"
        if (Math.random() < 0.006) {
            w.hesitate = 24 + Math.floor(Math.random() * 48);
            return;
        }
        // Último passo antes da prateleira: verifica se está ocupada
        if (w.path.length === 1) {
            const busy = workers.some(o => o !== w && o.shelf === w.shelf && o.state === 'picking');
            if (busy) {
                w.state = 'waiting_shelf';
                // Posiciona na borda da prateleira (lado do corredor)
                const ax = aisleFor(w.shelf), sc = mid(w.shelf);
                w.pos.x = sc.x + Math.sign(ax - sc.x) * (SW / 2 + 6);
                w.pos.y = sc.y;
                return;
            }
        }
        if (w.path.length && stepTo(w, w.path[0])) w.path.shift();
        if (!w.path.length) {
            w.state = 'picking';
            // Picking lento: faz o mínimo para não ser demitido
            w.timer = 90 + Math.floor(Math.random() * 70);
        }

    } else if (w.state === 'picking') {
        if (--w.timer <= 0) {
            // 35% de retrabalho: picking errado gera devolução de cliente
            if (!w.rework && Math.random() < 0.35) {
                w.rework   = true;
                const extra = randFrom(shelves.filter(s => s !== w.shelf));
                w.shelf    = extra;
                w.aisle    = aisleFor(extra);
                w.path     = chaosPath(w.pos, extra);
                w.state    = 'toShelf';
                w.hesitate = 14 + Math.floor(Math.random() * 20);
            } else {
                w.rework = false;
                w.state  = 'toDepot';
                // 35% de desgaste de equipamento: rota de retorno desnecessariamente larga
                w.path = Math.random() < 0.35
                    ? chaosPathReturn(w.pos, w.aisle)
                    : pathToDepot(w.pos, w.aisle);
            }
        }

    } else if (w.state === 'toDepot') {
        if (w.path.length && stepTo(w, w.path[0])) w.path.shift();
        if (!w.path.length) {
            // Não pode se auto-atribuir: aguarda coordenador receber a entrega
            w.state   = 'waiting_handoff';
            w.coordId = null;
        }
    }
}

// ============================================================
// MAESTRO VIEGLIN — 20 operadores, 3 zonas (7 + 7 + 6)
// ============================================================

const COORD_COLORS = [
    '#1e40af','#2563eb','#3b82f6','#60a5fa','#93c5fd','#bfdbfe','#dbeafe',
    '#166534','#16a34a','#22c55e','#4ade80','#86efac','#bbf7d0','#dcfce7',
    '#9f1239','#e11d48','#f43f5e','#fb7185','#fda4af','#fecdd3',
];

function initWorkers_coord(shelves) {
    return COORD_COLORS.map((color, i) => {
        const from  = { ...DEPOT_QUEUE[i] };
        const shelf = shelves[i % shelves.length]; // distribuição inicial por todo o armazém
        return {
            pos:        { ...from }, color, spd: SPEED,
            idx:        i,
            path:       pathTo(from, shelf), shelf,
            state:      'toShelf',
            startDelay: i * 5,
            timer:      0, trail: [],
            aisle:      aisleFor(shelf),
        };
    });
}

function tickWorker_coord(w, shelves) {
    if (w.startDelay > 0) { w.startDelay--; return; }

    if (w.state === 'toShelf') {
        if (w.path.length && stepTo(w, w.path[0])) w.path.shift();
        if (!w.path.length) { w.state = 'picking'; w.timer = 40; }

    } else if (w.state === 'picking') {
        if (--w.timer <= 0) {
            w.state = 'toDepot';
            w.path  = pathToDepot(w.pos, w.aisle);
        }
    } else if (w.state === 'toDepot') {
        if (w.path.length && stepTo(w, w.path[0])) w.path.shift();
        if (!w.path.length) {
            // IA atribui qualquer prateleira do armazém — picking fluido e constante
            const shelf = randFrom(shelves);
            w.shelf = shelf;
            w.aisle = aisleFor(shelf);
            w.path  = pathTo(w.pos, shelf);
            w.state = 'toShelf';
            w.trail = [];
        }
    }
}

// ============================================================
// DESENHO
// ============================================================

function draw(ctx, workers, shelves, mode, frame, coordinators, picks, lastPickFrame) {
    const FONT = "'Inter', 'Helvetica Neue', sans-serif";

    // ── Fundo ──
    ctx.fillStyle = '#06090f';
    ctx.fillRect(0, 0, CW, CH);

    // ── Dot grid (coerente com o hero do site) ──
    ctx.fillStyle = 'rgba(255,255,255,0.018)';
    for (let x = 28; x < CW; x += 28) {
        for (let y = 28; y < CH; y += 28) {
            ctx.beginPath(); ctx.arc(x, y, 0.7, 0, Math.PI * 2); ctx.fill();
        }
    }

    // ── Corredor base ──
    ctx.strokeStyle = 'rgba(255,255,255,0.05)';
    ctx.lineWidth = 1; ctx.setLineDash([4, 10]);
    ctx.beginPath(); ctx.moveTo(0, BOTTOM_Y); ctx.lineTo(CW, BOTTOM_Y); ctx.stroke();
    ctx.setLineDash([]);

    // ── Prateleiras (mesma paleta neutra nos dois modos) ──
    shelves.forEach(s => {
        const r = 3;
        ctx.fillStyle = 'rgba(255,255,255,0.03)';
        ctx.beginPath(); ctx.roundRect(s.x, s.y, s.w, s.h, r); ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,0.07)';
        ctx.lineWidth = 1; ctx.stroke();
        ctx.fillStyle = 'rgba(255,255,255,0.12)';
        ctx.fillRect(s.x + r, s.y, s.w - r * 2, 2);
    });

    // ── Labels de zona (Vieglin) ──
    if (mode === 'coordinated') {
        ctx.textAlign = 'center';
        ctx.fillStyle = 'rgba(255,255,255,0.28)';
        ctx.font = `600 8px ${FONT}`;
        [['A', 120], ['B', 360], ['C', 600]].forEach(([l, cx]) => {
            ctx.fillText(`ZONA ${l}`, cx, BOTTOM_Y - 9);
        });
    }

    // ── Expedição (Tradicional) ──
    if (mode === 'traditional') {
        ctx.fillStyle = 'rgba(251,191,36,0.06)';
        ctx.beginPath(); ctx.roundRect(DEPOT.x - 108, DEPOT.y - 15, 216, 26, 7); ctx.fill();
        ctx.strokeStyle = 'rgba(251,191,36,0.18)'; ctx.lineWidth = 1; ctx.stroke();
        ctx.fillStyle = 'rgba(251,191,36,0.7)';
        ctx.font = `600 9px ${FONT}`; ctx.textAlign = 'center';
        ctx.fillText('EXPEDIÇÃO', DEPOT.x, DEPOT.y + 3);
    }

    // ── Hub IA (Vieglin) ──
    if (mode === 'coordinated') {
        const hx = DEPOT.x, hy = DEPOT.y;
        const pulse = 3 + Math.sin(frame * 0.07) * 4;

        ctx.fillStyle = 'rgba(251,191,36,0.4)';
        ctx.font = `600 8px ${FONT}`; ctx.textAlign = 'center';
        ctx.fillText('EXPEDIÇÃO', hx, hy - 29);

        ctx.beginPath(); ctx.arc(hx, hy, 34 + pulse, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(64,112,244,0.07)'; ctx.lineWidth = 1.5; ctx.stroke();
        ctx.beginPath(); ctx.arc(hx, hy, 27 + pulse * 0.5, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(64,112,244,0.13)'; ctx.lineWidth = 1; ctx.stroke();

        ctx.setLineDash([2, 6]);
        workers.forEach(w => {
            ctx.beginPath(); ctx.moveTo(hx, hy); ctx.lineTo(w.pos.x, w.pos.y);
            ctx.strokeStyle = w.color + '22'; ctx.lineWidth = 0.6; ctx.stroke();
        });
        ctx.setLineDash([]);

        ctx.beginPath(); ctx.arc(hx, hy, 22, 0, Math.PI * 2);
        ctx.fillStyle = '#0a1628'; ctx.fill();
        ctx.strokeStyle = '#4070f4'; ctx.lineWidth = 1.5; ctx.stroke();

        ctx.beginPath(); ctx.arc(hx, hy, 13, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(64,112,244,0.35)'; ctx.lineWidth = 1; ctx.stroke();

        ctx.fillStyle = '#93c5fd';
        ctx.font = `700 11px ${FONT}`; ctx.textAlign = 'center';
        ctx.fillText('IA', hx, hy + 4);
    }

    // ── Coordenadores (Tradicional) ──
    if (coordinators) {
        const gColors = ['#f59e0b', '#fb923c'];
        coordinators.forEach((coord, ci) => {
            if ((coord.state === 'briefing' || coord.state === 'receiving') && coord.targetWorker) {
                const tw = coord.targetWorker;
                ctx.beginPath(); ctx.moveTo(coord.pos.x, coord.pos.y); ctx.lineTo(tw.pos.x, tw.pos.y);
                ctx.strokeStyle = gColors[ci] + '60';
                ctx.lineWidth = 1; ctx.setLineDash([3, 5]); ctx.stroke(); ctx.setLineDash([]);
            }
            const cr = 8, active = coord.state === 'briefing' || coord.state === 'receiving';
            if (active) {
                const p = 3 + Math.sin(frame * 0.2 + ci * Math.PI) * 2;
                ctx.beginPath(); ctx.arc(coord.pos.x, coord.pos.y, cr + p, 0, Math.PI * 2);
                ctx.strokeStyle = gColors[ci] + '40'; ctx.lineWidth = 1.5; ctx.stroke();
            }
            ctx.beginPath(); ctx.arc(coord.pos.x, coord.pos.y, cr, 0, Math.PI * 2);
            ctx.fillStyle = gColors[ci]; ctx.fill();
            ctx.strokeStyle = 'rgba(255,255,255,0.3)'; ctx.lineWidth = 1; ctx.stroke();
            ctx.fillStyle = 'rgba(0,0,0,0.8)';
            ctx.font = `700 6px ${FONT}`; ctx.textAlign = 'center';
            ctx.fillText(`G${ci + 1}`, coord.pos.x, coord.pos.y + 2.5);
        });
    }

    // ── Trilhas ──
    workers.forEach(w => {
        if (w.trail.length < 2) return;
        ctx.beginPath(); ctx.moveTo(w.trail[0].x, w.trail[0].y);
        w.trail.forEach(p => ctx.lineTo(p.x, p.y));
        const isRework = w.rework && w.state === 'toShelf';
        ctx.strokeStyle = isRework ? 'rgba(239,68,68,0.18)' : w.color + '1e';
        ctx.lineWidth = 1.5; ctx.stroke();
    });

    // ── Operadores ──
    workers.forEach(w => {
        const isTrad          = mode === 'traditional';
        const picking         = w.state === 'picking';
        const queued          = w.state === 'queued';
        const briefed         = w.state === 'being_briefed';
        const procrastinating = isTrad && (briefed || picking);
        const hesitating      = w.hesitate > 0 && w.state === 'toShelf';
        const handingOff      = w.state === 'waiting_handoff';
        const waitingShelf    = w.state === 'waiting_shelf';

        if (!procrastinating && picking) {
            ctx.beginPath(); ctx.arc(w.pos.x, w.pos.y, WORKER_R + 4 + Math.sin(frame * 0.18) * 1.5, 0, Math.PI * 2);
            ctx.strokeStyle = w.color + '55'; ctx.lineWidth = 1.5; ctx.stroke();
        }
        if (queued) {
            ctx.beginPath(); ctx.arc(w.pos.x, w.pos.y, WORKER_R + 3 + Math.sin(frame * 0.08 + w.idx) * 1.2, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(251,191,36,0.25)'; ctx.lineWidth = 1; ctx.stroke();
        }
        if (hesitating) {
            ctx.beginPath(); ctx.arc(w.pos.x, w.pos.y, WORKER_R + 5 + Math.sin(frame * 0.14) * 1.5, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(251,191,36,0.45)'; ctx.lineWidth = 1.5; ctx.stroke();
        }
        if (procrastinating) {
            ctx.beginPath(); ctx.arc(w.pos.x, w.pos.y, WORKER_R + 5 + Math.sin(frame * 0.08 + w.idx) * 2.5, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(239,68,68,0.4)'; ctx.lineWidth = 1.5; ctx.stroke();
        }
        if (handingOff) {
            ctx.beginPath(); ctx.arc(w.pos.x, w.pos.y, WORKER_R + 4 + Math.sin(frame * 0.22) * 2, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(127,29,29,0.6)'; ctx.lineWidth = 1.5; ctx.stroke();
        }
        if (waitingShelf) {
            ctx.beginPath(); ctx.arc(w.pos.x, w.pos.y, WORKER_R + 4 + Math.sin(frame * 0.25 + w.idx) * 2, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(255,255,255,0.28)'; ctx.lineWidth = 1.5; ctx.stroke();
        }

        ctx.beginPath(); ctx.arc(w.pos.x, w.pos.y, WORKER_R, 0, Math.PI * 2);
        if      (queued)          ctx.fillStyle = w.color + '88';
        else if (procrastinating) ctx.fillStyle = '#ef4444cc';
        else if (handingOff)      ctx.fillStyle = 'rgba(127,29,29,0.7)';
        else if (waitingShelf)    ctx.fillStyle = 'rgba(255,255,255,0.8)';
        else if (hesitating)      ctx.fillStyle = '#fbbf24dd';
        else if (picking)         ctx.fillStyle = '#fff';
        else                      ctx.fillStyle = w.color;
        ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,0.15)'; ctx.lineWidth = 1; ctx.stroke();
    });

    // ── Contador de picks ──
    const cColor   = mode === 'traditional' ? '#f87171' : '#4ade80';
    const flashAge = frame - lastPickFrame;
    const flash    = flashAge < 12 ? 1 - flashAge / 12 : 0;
    const pillW = 108, pillH = 38, pillX = CW - pillW - 10, pillY = CH - pillH - 10;

    ctx.fillStyle = 'rgba(255,255,255,0.03)';
    ctx.beginPath(); ctx.roundRect(pillX, pillY, pillW, pillH, 8); ctx.fill();
    ctx.strokeStyle = flash > 0 ? cColor + '50' : 'rgba(255,255,255,0.07)';
    ctx.lineWidth = 1; ctx.stroke();

    ctx.textAlign = 'right';
    ctx.fillStyle = cColor + '60';
    ctx.font = `600 8px ${FONT}`;
    ctx.fillText('PICKS', CW - 14, pillY + 14);

    const numSize = Math.round(20 + flash * 5);
    ctx.fillStyle = flash > 0 ? `rgba(255,255,255,${(0.55 + flash * 0.45).toFixed(2)})` : cColor;
    ctx.font = `700 ${numSize}px ${FONT}`;
    ctx.fillText(String(picks), CW - 14, pillY + 33);
}

// ============================================================
// INICIAR
// ============================================================

function startAnimation(canvasId, mode) {
    const canvas = document.getElementById(canvasId);
    if (!canvas) return;
    canvas.width = CW; canvas.height = CH;
    const ctx     = canvas.getContext('2d');
    const shelves = makeShelves();

    let workers, coordinators = null;
    if (mode === 'traditional') {
        workers      = initWorkers_trad();
        coordinators = makeCoordinators();
    } else {
        workers = initWorkers_coord(shelves);
    }

    let frame = 0, picks = 0, lastPickFrame = -99;
    (function tick() {
        if (coordinators) coordinators.forEach(c => tickCoordinator(c, workers, shelves));
        workers.forEach(w => {
            const prev = w.state;
            if (mode === 'traditional') tickWorker_trad(w, shelves, workers);
            else tickWorker_coord(w, shelves);
            // Conta 1:1 ao chegar na expedição (fim de toDepot)
            if (prev === 'toDepot' && w.state !== 'toDepot') {
                picks++;
                lastPickFrame = frame;
                if (typeof window !== 'undefined' && window.dispatchEvent) {
                    window.dispatchEvent(new CustomEvent('vg:pick', {
                        detail: { canvasId, mode, picks },
                    }));
                }
            }
        });
        draw(ctx, workers, shelves, mode, frame++, coordinators, picks, lastPickFrame);
        requestAnimationFrame(tick);
    })();
}

// Expose for multi-instance use
window.startVieglinAnimation = startAnimation;

  <script type="text/babel">
/* global React, ReactDOM */

// ── Widget (canvas comparison) ──────────────────────────────────────

// Shared widget: side-by-side comparison driven by window.startVieglinAnimation
// (defined in widget-engine.js).

const { useEffect, useRef } = React;

function VieglinWidget({ id, layout = 'side', stageClass = '' }) {
  const tradRef = useRef(null);
  const coordRef = useRef(null);
  const started = useRef(false);

  useEffect(() => {
    if (started.current) return;
    if (!window.startVieglinAnimation) return;
    if (!tradRef.current || !coordRef.current) return;
    // Stagger start so the two canvases don't allocate at exact same tick
    window.startVieglinAnimation(tradRef.current.id, 'traditional');
    window.startVieglinAnimation(coordRef.current.id, 'coordinated');
    started.current = true;
  }, []);

  const tradId = `vg-canvas-trad-${id}`;
  const coordId = `vg-canvas-coord-${id}`;

  return (
    <div className={`vg-widget vg-widget--${layout} ${stageClass}`}>
      <div className="vg-widget__panel">
        <div className="vg-widget__label">
          <span className="vg-tag vg-tag--red">Tradicional</span>
          <span className="vg-widget__desc">Coordenador orienta um operador por vez — filas, retrabalho, ociosidade.</span>
        </div>
        <canvas ref={tradRef} id={tradId} className="vg-canvas"></canvas>
      </div>
      <div className="vg-widget__panel">
        <div className="vg-widget__label">
          <span className="vg-tag vg-tag--green">Vieglin Maestro</span>
          <span className="vg-widget__desc">Zonas definidas, rotas otimizadas, máxima vazão em tempo real.</span>
        </div>
        <canvas ref={coordRef} id={coordId} className="vg-canvas"></canvas>
      </div>
    </div>
  );
}




// ── Main landing page ────────────────────────────────────────────────

const { useState: useStateA, useEffect: useEffectA, useRef: useRefA } = React;

function DirA_CDLabel({ canvasId, threshold = 1000 }) {
  const [cd, setCd] = useStateA(1);
  const [display, setDisplay] = useStateA(1);
  const [rolling, setRolling] = useStateA(false);
  const lastBucket = useRefA(0);
  const prevCd = useRefA(1);

  // Listen for pick events from this widget's coord canvas and step CD-XX
  useEffectA(() => {
    const onPick = (e) => {
      const d = e.detail || {};
      if (d.canvasId !== canvasId || d.mode !== 'coordinated') return;
      const bucket = Math.floor(d.picks / threshold);
      if (bucket > lastBucket.current) {
        lastBucket.current = bucket;
        setCd((c) => (c % 99) + 1);
      }
    };
    window.addEventListener('vg:pick', onPick);
    return () => window.removeEventListener('vg:pick', onPick);
  }, [canvasId, threshold]);

  // Scramble the digits when the CD value changes, then settle.
  useEffectA(() => {
    if (cd === prevCd.current) {
      setDisplay(cd);
      return;
    }
    prevCd.current = cd;
    setRolling(true);
    const interval = setInterval(() => {
      setDisplay(1 + Math.floor(Math.random() * 99));
    }, 55);
    const timeout = setTimeout(() => {
      clearInterval(interval);
      setDisplay(cd);
      setRolling(false);
    }, 720);
    return () => {
      clearInterval(interval);
      clearTimeout(timeout);
    };
  }, [cd]);

  const padded = String(display).padStart(2, '0');
  return (
    <span className={`dirA-cd${rolling ? ' dirA-cd--rolling' : ''}`}>CD‑{padded}</span>
  );
}

          </div>
          <h1 className="dirA-headline">
            <span className="dirA-headline__line">A ordem dos fatores altera o resultado!</span>

      {/* ── FEATURES ───────────────────────────────── */}
      <section className="dirA-features" id="suite">
        <div className="dirA-section-head">
          <div className="dirA-eyebrow">A Suíte Maestro</div>
          <h2 className="dirA-h2">
            Três instrumentos.<br />
            Uma única regência operacional.
          </h2>
        </div>

        <div className="dirA-features__grid">
          <article className="dirA-feature dirA-feature--lg dirA-feature--online">
            <div className="dirA-feature__num">01</div>
            <h3>Maestro Picking</h3>
            <p>Recebe ordens de serviço do seu WMS, monta a sequência exata em que cada pedido deve ser separada e distribui tarefas entre operadores enquanto a expedição acontece. A operação segue um roteiro inteligente; o WMS continua intacto.</p>
            <ul className="dirA-feature__list">
              <li>Plano de picking por ordem de serviço</li>
              <li>Sequenciamento por retorno/esforço</li>
              <li>Orquestração contínua entre zonas</li>
            </ul>
            <span className="dirA-feature__chip"><span className="dirA-feature__chip__dot" />Live</span>
          </article>

          <article className="dirA-feature dirA-feature--online">
            <div className="dirA-feature__num">02</div>
            <h3>Maestro JIT</h3>
            <p>Aplica a mesma lógica de sequenciamento a recursos físicos: empilhadeiras, tratores, carretas e docas. Para que cada movimento aconteça no momento certo do ciclo de expedição.</p>
            <span className="dirA-feature__chip"><span className="dirA-feature__chip__dot" />Live</span>
          </article>

          <article className="dirA-feature">
            <div className="dirA-feature__num">03</div>
            <h3>Maestro YOS</h3>
            <p>Orquestra o pátio de cargas: filas de motoristas, alocação de docas e janelas de carregamento. Com a mesma inteligência que regula o picking no armazém.</p>
            <span className="dirA-feature__chip dirA-feature__chip--soon">
              <span className="dirA-feature__chip__spinner" />
              Loading
            </span>
          </article>
        </div>
      </section>

      {/* ── HOW IT WORKS ────────────────────────────── */}
      <section className="dirA-how" id="how">
        <div className="dirA-section-head">
          <div className="dirA-eyebrow">Como funciona</div>
          <h2 className="dirA-h2">Conecta. Sequencia. Executa.</h2>
        </div>
        <div className="dirA-how__rows">
          <div className="dirA-how__row">
            <div className="dirA-how__step">01</div>
            <div className="dirA-how__title">Integração com seus sistemas</div>
            <div className="dirA-how__desc">Um agente de integração lê os dados da sua operação — WMS, ERP — e os envia ao Maestro conforme novas ordens de serviço surgem. Sem migração, sem substituir o que já funciona.</div>
            <div className="dirA-how__rule" />
          </div>
          <div className="dirA-how__row">
            <div className="dirA-how__step">02</div>
            <div className="dirA-how__title">Sequenciamento em tempo real</div>
            <div className="dirA-how__desc">O motor calcula quais ordens de serviço devem ser separadas em seguida, maximizando retorno por esforço de acordo com o seu objetivo operacional.</div>
            <div className="dirA-how__rule" />
          </div>
          <div className="dirA-how__row">
            <div className="dirA-how__step">03</div>
            <div className="dirA-how__title">Plano no chão de operação</div>
            <div className="dirA-how__desc">O plano chega ao chão da operação: cada operador, empilhadeira e veículo recebe a próxima atividade, coordenada com as demais — sem filas paralelas, sem decisões arbitrárias.</div>

const FORMSPREE_ENDPOINT = 'https://formspree.io/thomas@vieglin.com';

const { useState } = React;

  const [fields, setFields] = useState({
    nome: '', email: '', telefone: '', empresa: '', problema: '',
  });
  const [status, setStatus]   = useState('idle');
  const [errorMsg, setErrorMsg] = useState('');

  const handleChange = (e) => {
    setFields(prev => ({ ...prev, [e.target.name]: e.target.value }));
  };

  const handleSubmit = async (e) => {
    e.preventDefault();
    setStatus('loading');
    setErrorMsg('');
    try {
      const res  = await fetch(FORMSPREE_ENDPOINT, {
        method:  'POST',
        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
        body:    JSON.stringify(fields),
      });
      const data = await res.json();

        setStatus('error');
      }

          <nav className="dirA-nav__links">
            <a href="#" onClick={(e) => { e.preventDefault(); onNavigate("home"); }}>Suíte Maestro</a>
            <a href="#" onClick={(e) => { e.preventDefault(); onNavigate("home"); }}>Como funciona</a>
            <a href="#" onClick={(e) => { e.preventDefault(); onNavigate("home"); }}>Clientes</a>
            <a href="#" onClick={(e) => { e.preventDefault(); onNavigate("home"); }}>Contato</a>
          </nav>
          <a className="dirA-cta" href="#" onClick={(e) => { e.preventDefault(); onNavigate("home"); }} style={{ color: 'rgb(224, 242, 254)' }}>
            ← Voltar ao site
          </a>
        </div>
      </header>

      {/* ── Main ── */}
      <main className="fd-main">
        <div className="fd-main__inner">

          {/* Left — info */}
          <div className="fd-info">
            <div className="fd-info__eyebrow">// Demonstração</div>
            <h1 className="fd-info__h1">
              Veja o Maestro<br />na sua operação.
            </h1>
            <p className="fd-info__sub">
              Em 45 minutos percorremos o caminho completo — da ordem de serviço ao plano
              de picking — com os seus dados reais, e mostramos quanta eficiência está
              sendo desperdiçada hoje. Sem integração, sem compromisso.
            </p>
            <div className="fd-info__divider" />
            <ul className="fd-info__list">
              <li>Diagnóstico do fluxo de ordens de serviço no seu CD</li>
              <li>Simulação de plano de picking com o Maestro</li>
              <li>Estimativa de ROI para o seu volume</li>
            </ul>
            <p className="fd-info__note">
              Resultados medidos em produção: +15% de eficiência operacional e −40% de ociosidade dos operadores.
            </p>
          </div>

          {/* Right — card */}
          <div className="fd-card">
            {status === 'success' ? (
              <div className="fd-success">
                <div className="fd-success__icon">✓</div>
                <h2 className="fd-success__title">Solicitação recebida.</h2>
                <p className="fd-success__sub">
                  Em breve entraremos em contato para confirmar o horário da demonstração.
                </p>
                <a href="#" onClick={(e) => { e.preventDefault(); onNavigate("home"); }} className="fd-btn fd-btn--ghost">
                  ← Voltar ao início
                </a>
              </div>
            ) : (
              <form className="fd-form" onSubmit={handleSubmit}>

                <div className="fd-form__head">
                  <span className="fd-form__tag">Agendar Demonstração</span>
                </div>

                <div className="fd-field">
                  <label className="fd-label" htmlFor="nome">Nome completo</label>
                  <input
                    className="fd-input" id="nome" name="nome" type="text"
                    required placeholder="João da Silva"
                    value={fields.nome} onChange={handleChange} disabled={loading}
                  />
                </div>

                <div className="fd-field-row">
                  <div className="fd-field">
                    <label className="fd-label" htmlFor="email">E-mail corporativo</label>
                    <input
                      className="fd-input" id="email" name="email" type="email"
                      required placeholder="joao@empresa.com.br"
                      value={fields.email} onChange={handleChange} disabled={loading}
                    />
                  </div>
                  <div className="fd-field">
                    <label className="fd-label" htmlFor="telefone">Telefone / WhatsApp</label>
                    <input
                      className="fd-input" id="telefone" name="telefone" type="tel"
                      required placeholder="+55 47 9 0000-0000"
                      value={fields.telefone} onChange={handleChange} disabled={loading}
                    />
                  </div>
                </div>

                <div className="fd-field">
                  <label className="fd-label" htmlFor="empresa">Empresa</label>
                  <input
                    className="fd-input" id="empresa" name="empresa" type="text"
                    required placeholder="Nome da empresa ou grupo"
                    value={fields.empresa} onChange={handleChange} disabled={loading}
                  />
                </div>

                <div className="fd-field">
                  <label className="fd-label" htmlFor="problema">
                    Qual o principal problema da sua operação?
                  </label>
                  <textarea
                    className="fd-input fd-textarea" id="problema" name="problema"
                    required rows={4}
                    placeholder="Ex: demora na separação de pedidos, erros de embarque, ociosidade dos operadores..."
                    value={fields.problema} onChange={handleChange} disabled={loading}
                  />
                </div>

                {status === 'error' && (
                  <div className="fd-error">{errorMsg}</div>
                )}

                <div className="fd-actions">
                  <button className="fd-btn fd-btn--solid" type="submit" disabled={loading}>
                    {loading
                      ? <><span className="fd-spinner" /> Enviando...</>
                      : 'Agendar demonstração →'
                    }
                  </button>
                  <p className="fd-form__privacy">
                    Seus dados são usados exclusivamente para o agendamento e nunca serão compartilhados com terceiros.
                  </p>
                </div>

              </form>
            )}
          </div>

        </div>
      </main>

      {/* ── Footer ── */}
      <footer className="fd-footer">
        <span>FUNDADA EM 2026</span>
        <span>EDIFICANDO A OPERAÇÃO AGÊNTICA.</span>
        <span className="fd-footer__copyright">© 2026 Vieglin, Inc. Todos os direitos reservados.</span>
      </footer>

    </div>
  );
}




// ── App router ───────────────────────────────────────────────────────

function App() {
  const [page, setPage] = useState('home');

  const navigate = (target) => {
    setPage(target);
    window.scrollTo({ top: 0, behavior: 'auto' });
  };

  if (page === 'form') return <FormDemo onNavigate={navigate} />;
  return <DirCinematica onNavigate={navigate} />;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);

  </script>
</body>
</html>
